<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Danh sách 13 trải nghiệm khám phá Đảo Khỉ – An Việt Travel">
  <title>13 – Khám phá Đảo Khỉ | An Việt Travel</title>
  <style>
    /* Toàn bộ CSS được giới hạn trong #anviet-dao-khi để không xung đột Google Sites */
    #anviet-dao-khi {
      --ink: #064557;
      --muted: #66818b;
      --orange: #ff8418;
      --line: #dce9e9;
      --paper: #f5faf9;
      box-sizing: border-box;
      width: 100%;
      padding: clamp(22px, 4vw, 48px) clamp(14px, 3vw, 42px) 54px;
      color: var(--ink);
      background: linear-gradient(180deg, #fbfdfc 0%, #f1f8f7 100%);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    #anviet-dao-khi *, #anviet-dao-khi *::before, #anviet-dao-khi *::after {
      box-sizing: border-box;
    }
    #anviet-dao-khi .content {
      width: min(100%, 1680px);
      margin: 0 auto;
    }
    #anviet-dao-khi .section-heading {
      display: flex;
      align-items: center;
      gap: 17px;
      margin: 0 0 28px;
    }
    #anviet-dao-khi .count {
      color: var(--orange);
      font-size: clamp(38px, 4vw, 52px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -2px;
      flex: 0 0 auto;
    }
    #anviet-dao-khi .eyebrow {
      margin: 0 0 5px;
      color: #78919a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #anviet-dao-khi h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(24px, 2.5vw, 34px);
      line-height: 1.18;
      font-weight: 800;
    }
    #anviet-dao-khi .heading-line {
      width: 78px;
      height: 5px;
      margin-top: 14px;
      border-radius: 20px;
      background: var(--orange);
    }
    #anviet-dao-khi .schedule {
      display: grid;
      grid-template-columns: 1.05fr 1.5fr 1.5fr 1.5fr;
      gap: 12px;
      margin: 0 0 30px;
      padding: 13px;
      border: 1px solid #d6e7e6;
      border-radius: 22px;
      background: linear-gradient(100deg, #f1faf8, #fffaf5);
    }
    #anviet-dao-khi .schedule-label,
    #anviet-dao-khi .schedule-item {
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 14px 18px;
      border-radius: 16px;
    }
    #anviet-dao-khi .schedule-label {
      background: #064557;
      color: white;
    }
    #anviet-dao-khi .schedule-label small {
      margin-bottom: 6px;
      color: #a9c5ca;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    #anviet-dao-khi .schedule-label strong {
      font-size: 20px;
      letter-spacing: .5px;
    }
    #anviet-dao-khi .schedule-item {
      border: 1px solid var(--line);
      background: #fff;
    }
    #anviet-dao-khi .schedule-item span {
      margin-bottom: 8px;
      color: #718993;
      font-size: 14px;
      font-weight: 700;
    }
    #anviet-dao-khi .schedule-item strong {
      color: var(--ink);
      font-size: 18px;
      line-height: 1.25;
    }
    #anviet-dao-khi .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }
    #anviet-dao-khi .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #dce8e8;
      border-radius: 27px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(8, 54, 65, .07);
      transition: transform .22s ease, box-shadow .22s ease;
    }
    #anviet-dao-khi .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 38px rgba(8, 54, 65, .12);
    }
    #anviet-dao-khi .photo {
      position: relative;
      width: 100%;
      aspect-ratio: 1.5 / 1;
      overflow: hidden;
      background: #e4efec;
    }
    #anviet-dao-khi .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    /* Nút phóng to xuất hiện đồng nhất trên tất cả ảnh */
    #anviet-dao-khi .photo img {
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }
    #anviet-dao-khi .zoom-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #07566a;
      background: rgba(255,255,255,.96);
      box-shadow: 0 3px 12px rgba(0,0,0,.16);
      cursor: zoom-in;
      transition: transform .18s ease, background .18s ease;
    }
    #anviet-dao-khi .zoom-btn:hover {
      transform: scale(1.08);
      background: #fff;
    }
    #anviet-dao-khi .zoom-btn svg { width: 21px; height: 21px; }
    .anviet-lightbox {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 28px;
      background: rgba(2, 20, 27, .92);
    }
    .anviet-lightbox.is-open { display: flex; }
    .anviet-lightbox img {
      display: block;
      max-width: min(94vw, 1500px);
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      transform: scale(var(--zoom-scale, 1));
      transition: transform .18s ease;
    }
    .anviet-lightbox-toolbar {
      position: fixed;
      top: 16px;
      right: 20px;
      display: flex;
      gap: 9px;
      align-items: center;
    }
    .anviet-lightbox-toolbar button {
      display: grid;
      place-items: center;
      min-width: 42px;
      height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 22px;
      color: #fff;
      background: rgba(255,255,255,.14);
      font: 700 18px Arial, sans-serif;
      cursor: pointer;
    }
    .anviet-lightbox-toolbar button:hover { background: rgba(255,255,255,.27); }
    .anviet-lightbox-caption {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font: 600 15px Arial, sans-serif;
      text-align: center;
    }
    @media (max-width: 600px) {
      #anviet-dao-khi .zoom-btn { width: 39px; height: 39px; top: 12px; right: 12px; }
      .anviet-lightbox { padding: 70px 10px 40px; }
      .anviet-lightbox img { max-width: 96vw; max-height: 76vh; }
      .anviet-lightbox-toolbar { right: 10px; top: 10px; }
    }
    #anviet-dao-khi .number {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border-radius: 50%;
      color: #fff;
      background: #064557;
      border: 2px solid rgba(255,255,255,.75);
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }
    #anviet-dao-khi .card-body {
      min-height: 185px;
      padding: 20px 22px 24px;
    }
    #anviet-dao-khi .card h2 {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: clamp(18px, 1.45vw, 22px);
      line-height: 1.28;
      font-weight: 800;
    }
    #anviet-dao-khi .card p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.62;
      font-weight: 400;
    }
    @media (max-width: 1050px) {
      #anviet-dao-khi .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      #anviet-dao-khi .schedule { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      #anviet-dao-khi { padding: 24px 12px 36px; }
      #anviet-dao-khi .section-heading { gap: 12px; margin-bottom: 22px; }
      #anviet-dao-khi .count { font-size: 42px; }
      #anviet-dao-khi .eyebrow { font-size: 10px; letter-spacing: 2px; }
      #anviet-dao-khi h1 { font-size: 23px; }
      #anviet-dao-khi .schedule { grid-template-columns: 1fr; gap: 9px; padding: 10px; }
      #anviet-dao-khi .schedule-label,
      #anviet-dao-khi .schedule-item { min-height: 68px; padding: 12px 15px; }
      #anviet-dao-khi .cards { grid-template-columns: 1fr; gap: 17px; }
      #anviet-dao-khi .card-body { min-height: 0; padding: 17px 18px 21px; }
      #anviet-dao-khi .card h2 { font-size: 20px; }
      #anviet-dao-khi .card p { font-size: 15px; }
      #anviet-dao-khi .number { width: 39px; height: 39px; top: 12px; left: 12px; }
    }
  </style>
</head>

    const container = document.getElementById("activity-cards");
    container.innerHTML = activities.map((item, index) => {
      const number = String(index + 1).padStart(2, "0");
      const imagePath = activityImages[number];
      return `
        <article class="card">
          <div class="photo">
            <img src="${imagePath}" alt="${item.title}" loading="${index < 4 ? "eager" : "lazy"}">

    // Lightbox dùng chung cho tất cả 13 ảnh, có nút phóng to/thu nhỏ.
    const lightbox = document.createElement("div");
    lightbox.className = "anviet-lightbox";
    lightbox.setAttribute("role", "dialog");
    lightbox.setAttribute("aria-modal", "true");
    lightbox.setAttribute("aria-label", "Xem ảnh trải nghiệm");
    lightbox.innerHTML = `
      <div class="anviet-lightbox-toolbar">
        <button type="button" data-zoom="out" aria-label="Thu nhỏ ảnh" title="Thu nhỏ">−</button>
        <button type="button" data-zoom="in" aria-label="Phóng to ảnh" title="Phóng to">+</button>

      <img alt="Ảnh trải nghiệm đang xem">
      <div class="anviet-lightbox-caption"></div>`;
    document.body.appendChild(lightbox);
    const lightboxImage = lightbox.querySelector("img");
    const lightboxCaption = lightbox.querySelector(".anviet-lightbox-caption");
    let zoomScale = 1;
    function setZoom(value) {
      zoomScale = Math.max(.5, Math.min(3, value));
      lightboxImage.style.setProperty("--zoom-scale", zoomScale);
    }
    function closeLightbox() {
      lightbox.classList.remove("is-open");
      document.body.style.overflow = "";
      setZoom(1);
    }
    document.getElementById("activity-cards").addEventListener("click", (event) => {
      const button = event.target.closest(".zoom-btn");
      if (!button) return;
      const photo = button.closest(".photo");
      const img = photo.querySelector("img");
      const title = button.closest(".card").querySelector("h2").textContent;
      lightboxImage.src = img.src;
      lightboxImage.alt = img.alt;
      lightboxCaption.textContent = title;
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
      setZoom(1);
    });
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox || event.target.closest("[data-close]")) {
        closeLightbox();
        return;
      }
      const control = event.target.closest("[data-zoom]");
      if (!control) return;
      const action = control.dataset.zoom;
      if (action === "in") setZoom(zoomScale + .25);
      if (action === "out") setZoom(zoomScale - .25);
      if (action === "reset") setZoom(1);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && lightbox.classList.contains("is-open")) closeLightbox();
    });
  </script>
</body>
</html>
